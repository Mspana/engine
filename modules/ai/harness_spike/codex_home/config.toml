[model_providers.sink]
name = "Local request sink (debug)"
base_url = "http://localhost:4141/v1"
env_key = "LITELLM_SPIKE_KEY"
wire_api = "responses"

[model_providers.xai]
name = "xAI Grok"
base_url = "https://api.x.ai/v1"
env_key = "XAI_API_KEY"
wire_api = "responses"
